<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="stage">
    <div class="tiles-grid" id="tilesGrid" aria-label="Pinned shortcuts"></div>
  </main>

  <button
    type="button"
    id="editToggle"
    class="pencil-btn"
    title="Customize shortcuts"
    aria-label="Customize shortcuts"
    aria-expanded="false"
  >
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
  </button>

  <aside id="editorPanel" class="editor-popover hidden" aria-label="Manage shortcuts">
    <div class="editor-header">
      <span class="editor-title" id="formHeading">Shortcuts</span>
      <button type="button" id="closeEditor" class="icon-close" aria-label="Close">&times;</button>
    </div>

    <ul id="editorList" class="editor-list"></ul>

    <form id="shortcutForm" class="editor-form" autocomplete="off">
      <input type="hidden" id="editIndex" value="-1">
      <input type="text" id="inputTitle" placeholder="Name" maxlength="24" required aria-label="Shortcut name">
      <input type="text" id="inputUrl" placeholder="https://example.com" required aria-label="Shortcut URL">
      <div class="editor-actions">
        <button type="submit" id="saveBtn" class="btn-primary">Add</button>
        <button type="button" id="cancelEditBtn" class="btn-ghost hidden">Cancel</button>
      </div>
    </form>
  </aside>

  <script src="newtab.js"></script>
</body>
</html>
