<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kestrel Shield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="brand">
        <span class="dot" id="statusDot"></span>
        <h1>Kestrel Shield</h1>
      </div>
      <label class="master-switch" title="Toggle Shields for this site">
        <input type="checkbox" id="toggleSiteShield">
      </label>
    </header>

    <section class="hero">
      <div class="hero-left">
        <div class="site-host" id="siteHost">—</div>
        <div class="site-state" id="statusBadge">Shields UP</div>
      </div>
      <div class="hero-count">
        <span class="count-num" id="blockedCount">0</span>
        <span class="count-label">Blocked</span>
      </div>
    </section>

    <section class="segment-group" id="levelGroup">
      <span class="segment-label">Blocking Level</span>
      <div class="segmented">
        <button type="button" class="seg-btn active" data-level="standard">Standard</button>
        <button type="button" class="seg-btn" data-level="aggressive">Aggressive</button>
      </div>
    </section>

    <section class="controls">
      <label class="toggle-row" id="scriptsRow">
        <span>
          <strong>Block Scripts</strong>
          <small>Disable JS on this site</small>
        </span>
        <input type="checkbox" id="toggleScripts">
      </label>

      <label class="toggle-row">
        <span>
          <strong>Anti-Fingerprinting</strong>
          <small>Canvas/audio jitter &amp; beacon block</small>
        </span>
        <input type="checkbox" id="toggleFingerprint">
      </label>

      <label class="toggle-row">
        <span>
          <strong>Cosmetic Filtering</strong>
          <small>Hide ad &amp; sponsored containers</small>
        </span>
        <input type="checkbox" id="toggleCosmetic">
      </label>

      <label class="toggle-row">
        <span>
          <strong>Annoyances &amp; Cookies</strong>
          <small>Block cookie banners &amp; popups</small>
        </span>
        <input type="checkbox" id="toggleAnnoyances">
      </label>

      <label class="toggle-row">
        <span>
          <strong>Strip Tracking Params</strong>
          <small>Remove utm_*, fbclid, gclid</small>
        </span>
        <input type="checkbox" id="toggleTrackingParams">
      </label>
    </section>

    <footer class="footer">
      <span class="meta" id="ruleCount">28,724 DNR + 3.3k CSS</span>
      <div class="footer-actions">
        <button type="button" id="toggleGlobalBtn" class="link-btn subtle">Global: ON</button>
        <button type="button" id="openOptions" class="link-btn">Options</button>
      </div>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
